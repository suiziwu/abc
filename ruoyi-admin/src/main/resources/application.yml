# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ./upload
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# LangChain / LangChain4j 配置（百炼 qwen3.7-flash）
langchain:
  # LangGraph StateGraph 工作流清单
  workflow-location: classpath:langchain/rencai-huaxiang-20260914150500.langgraph.json
  # 百炼 OpenAI 兼容接口（当前业务空间）
  base-url: https://ws-uxxtz5szu7puw1so.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  # 优先从环境变量 DASHSCOPE_API_KEY 读取，未配置时启动不受影响，仅调用时报错
  api-key: ${DASHSCOPE_API_KEY:}
  model-name: qwen3.8-flash
  temperature: 1.0
  timeout-seconds: 300
  log-requests: false
  log-responses: false

# 语音识别（Qwen-Audio-3.1-ASR-Flash-Filetrans 录音文件识别）
ai:
  # 可选对话模型清单（OpenAI 兼容接口），前端会读取 /project/course/models
  chat:
    default-model: qwen3.8-flash
    models:
      - id: qwen3.8-flash
        label: 通义千问 3.8 Flash
        base-url: https://ws-uxxtz5szu7puw1so.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        api-key: ${DASHSCOPE_API_KEY:}
        model: qwen3.8-flash
        temperature: 1.0
        timeout-seconds: 300
      - id: deepseek-chat
        label: DeepSeek Chat
        base-url: https://api.deepseek.com/v1
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-chat
        temperature: 1.0
        timeout-seconds: 300
  asr:
    dashscope-base-url: https://ws-uxxtz5szu7puw1so.cn-beijing.maas.aliyuncs.com/api/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-audio-3.1-asr-flash-filetrans
    sample-rate: 16000
    language: zh
    max-audio-seconds: 120
    poll-interval-ms: 2000
    timeout-seconds: 180

# 开发环境配置
server:
  # 服务器的HTTP端口（本机8080被Steam占用，改为8081）
  port: 8081
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 1024MB
      # 设置总上传的文件大小
      max-request-size: 2048MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# media_kit 本地视频/文档解析服务（Python，代码见 tools/media_kit）
media-kit:
  # 服务地址；由 tools/start_media_kit.ps1 启动，默认监听 127.0.0.1:8130
  base-url: http://127.0.0.1:8130
  # 与启动时 MEDIA_KIT_TOKEN 保持一致；为空表示不鉴权（仅本机监听）
  token:
  # 单次解析超时（秒），长视频/扫描件可调大
  timeout-seconds: 600
  # 上传文件保存目录；为空时使用 <ruoyi.profile>/media_kit
  upload-dir:

# 知识库（RAG）：视频 AI 助教改为「先检索知识库，再生成回答」
kb:
  # 总开关；关闭后退回“前端传课程文本”的旧链路
  enabled: true
  # 向量库实现：local（MySQL 存向量，Windows 开箱可用）| milvus
  provider: local
  # 切块目标长度（字符）与重叠：对标百炼「智能切分 600 token」，中文约 900 字符；
  # 课程逐字稿按 600 字符一个窗口，保留 100 字符重叠
  chunk-size: 600
  chunk-overlap: 100
  # 检索返回条数与相似度下限（余弦，-1~1）
  top-k: 6
  min-score: 0.2
  # 召回策略：向量 + 关键词双路并行，RRF 融合
  retrieval:
    hybrid: true
    # 单路召回候选数（百炼建议 50~100）
    candidate-k: 50
    rrf-k: 60
    keyword-min-score: 0
    dedupe-by-hash: true
  # 精排（百炼 rerank）：默认关闭，配置 api-key 后置 enabled=true 生效
  rerank:
    enabled: false
    base-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    api-key:
    model: qwen3-rerank
    top-n: 20
    timeout-seconds: 10
  embedding:
    # 为空时回退到 langchain.api-key
    api-key:
    # 为空时回退到 ai.chat.models 中第一个模型的 base-url
    base-url:
    model: text-embedding-v3
    dimensions: 1024
    batch-size: 10
    timeout-seconds: 60
  milvus:
    # Milvus 2.4+ RESTful v2，启动方式见 docker-compose.milvus.yml
    base-url: http://127.0.0.1:19530
    collection: course_kb
    # Milvus 连不上时自动回退 local，避免影响问答主流程
    fallback-to-local: true

