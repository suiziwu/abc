[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-kit"
version = "1.0.0"
description = "通用视频/文档解析组件：插件式格式扩展、标准错误码、统一入出参"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.4"]
pdf = ["pymupdf>=1.23"]
office = ["python-docx>=1.1", "python-pptx>=0.6", "openpyxl>=3.1"]
ocr = ["rapidocr-onnxruntime>=1.3"]
all = [
    "imageio-ffmpeg>=0.4",
    "pymupdf>=1.23",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "rapidocr-onnxruntime>=1.3",
]

[tool.setuptools.packages.find]
include = ["media_kit*"]
exclude = ["media_kit.tests*", "media_kit.examples*"]
